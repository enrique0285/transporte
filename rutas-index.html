<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta del Día — GSH</title>
<style>
  :root {
    --brand: #3b2a1f;
    --brand-light: #6f4e37;
    --accent: #c8a165;
    --bg: #f6f3ef;
    --card: #ffffff;
    --border: #e2dcd3;
    --text: #2b241d;
    --muted: #7a7166;
    --ok: #3a7d44;
    --warn: #b8863b;
    --err: #b3402f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--brand);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .fecha { font-size: 13px; color: var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
  .field { margin-bottom: 8px; }
  .row-actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  button { background: var(--brand); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
  button:hover { background: var(--brand-light); }
  button.secondary { background: transparent; color: var(--brand); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { font-size: 13px; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 30px 0; }
  details summary { cursor: pointer; font-size: 13px; color: var(--brand); margin-bottom: 8px; }

  ol.stops { list-style: none; margin: 0; padding: 0; counter-reset: stop; }
  ol.stops li { counter-increment: stop; display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  ol.stops li:last-child { border-bottom: none; }
  ol.stops li.done { opacity: .55; }
  ol.stops li.done .cliente::after { content: " ✓ Entregado"; color: var(--ok); font-weight: 600; }
  ol.stops li.incident { border-left: 3px solid var(--err); padding-left: 9px; background: #fdf3f1; }
  ol.stops li.incident .cliente::after { content: " ⚠ Incidencia"; color: var(--err); font-weight: 600; }

  .stop-num { background: var(--accent); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .stop-info { flex: 1; min-width: 0; }
  .stop-info .horario { font-weight: 700; color: var(--brand); font-size: 14px; }
  .stop-info .cliente { font-weight: 600; font-size: 14px; margin-top: 2px; }
  .stop-info .direccion { font-size: 13px; color: var(--muted); }
  .stop-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stop-info a.tel, .stop-info a.maps { color: var(--brand); text-decoration: none; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; display: inline-block; }
  .badge-inicial { background: #e5f0e6; color: var(--ok); }
  .badge-incidencia { background: #fdf0e0; color: var(--warn); }
  .badge-pallets { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .badge-ascensor { background: #fdf3f1; color: var(--err); }

  .stop-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .stop-actions button { padding: 7px 11px; font-size: 12px; font-weight: 600; }
  .btn-entregado { background: var(--ok); }
  .btn-entregado:hover { background: #2f6737; }
  .btn-incidencia { background: var(--err); }
  .btn-incidencia:hover { background: #93331f; }
  .btn-deca { background: var(--accent); }
  .btn-deca:hover { background: #b58e52; }
  .btn-deca-off { background: var(--border); color: var(--muted); cursor: default; }
  .btn-deca-off:hover { background: var(--border); }

  .stop-form { margin-top: 10px; padding: 10px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); display: none; }
  .stop-form.open { display: block; }
  .stop-form textarea { width: 100%; min-height: 60px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; margin-bottom: 8px; }
  .stop-form input[type=file] { font-size: 12px; margin-bottom: 8px; display: block; }
  .stop-form .form-actions { display: flex; gap: 8px; }
  .stop-form .form-actions button.secondary { padding: 6px 10px; font-size: 12px; }
  .stop-sending { font-size: 12px; color: var(--muted); }
  .thumb-preview { max-width: 100px; max-height: 100px; border-radius: 6px; margin-top: 6px; display: block; }
</style>
</head>
<body>

<header>
  <h1>🚚 Ruta del Día — GSH</h1>
  <div class="fecha" id="fechaLabel"></div>
</header>

<main>

  <div class="card">
    <details id="configDetails">
      <summary>⚙️ Configuración (pulsa para ajustar)</summary>
      <div class="field">
        <label>URL del Gist (raw JSON) con las paradas del día</label>
        <input type="text" id="gistUrl" placeholder="https://gist.githubusercontent.com/.../raw/gsh-rutas-dia.json">
      </div>
      <div class="field">
        <label>URL del webhook de Power Automate (marcar entrega/incidencia)</label>
        <input type="text" id="webhookUrl" placeholder="https://prod-xx.westeurope.logic.azure.com/workflows/.../triggers/manual/paths/invoke?...">
      </div>
      <div style="font-size:12px; color:var(--muted); margin-top:6px;">
        Estas URLs se guardan solo en este navegador (localStorage), no se suben a ningún sitio.
      </div>
    </details>
    <div class="row-actions">
      <button id="cargarBtn">Cargar paradas del día</button>
      <span id="status"></span>
    </div>
  </div>

  <div class="card">
    <h2>Orden de reparto</h2>
    <div id="stopsContainer"><div class="empty">Configura la URL del Gist y pulsa "Cargar paradas del día".</div></div>
  </div>

</main>

<script>
const el = id => document.getElementById(id);
const statusEl = el('status');
let paradasRaw = [];

function limpiarUrl(url) {
  return url.replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '').trim();
}

function loadConfig() {
  el('gistUrl').value = localStorage.getItem('mf_gist_url') || '';
  el('webhookUrl').value = localStorage.getItem('mf_webhook') || '';
  if (!el('gistUrl').value) el('configDetails').open = true;
}
function saveConfig() {
  localStorage.setItem('mf_gist_url', el('gistUrl').value.trim());
  localStorage.setItem('mf_webhook', el('webhookUrl').value.trim());
}

function setStatus(msg, type) { statusEl.textContent = msg; statusEl.className = type || ''; }

el('fechaLabel').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

// Extrae la hora de inicio de un horario tipo "9:00 - 10:00" para poder ordenar
function horaInicioMinutos(horario) {
  if (!horario) return 99999; // sin horario, al final
  const m = horario.match(/(\d{1,2}):(\d{2})/);
  if (!m) return 99999;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}

async function cargarParadas() {
  saveConfig();
  const gistUrl = limpiarUrl(el('gistUrl').value);
  if (!gistUrl) { setStatus('Falta la URL del Gist.', 'err'); return; }
  setStatus('Cargando paradas...');
  el('stopsContainer').innerHTML = '<div class="empty">Cargando...</div>';
  try {
    const res = await fetch(gistUrl + (gistUrl.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    paradasRaw = (data.paradas || []).slice().sort((a, b) => horaInicioMinutos(a.horario) - horaInicioMinutos(b.horario));
    setStatus(`${paradasRaw.length} parada(s) cargada(s).`, 'ok');
    renderParadas();
  } catch (err) {
    setStatus('Error cargando el Gist: ' + err.message, 'err');
    el('stopsContainer').innerHTML = `<div class="empty">❌ No se pudieron cargar las paradas. ${err.message}</div>`;
    paradasRaw = [];
  }
}

function renderParadas() {
  const container = el('stopsContainer');
  if (!paradasRaw.length) {
    container.innerHTML = '<div class="empty">No hay paradas para hoy.</div>';
    return;
  }
  container.innerHTML = '';
  const ol = document.createElement('ol');
  ol.className = 'stops';

  paradasRaw.forEach((p, idx) => {
    const stopKey = p.pedidoId || `idx-${idx}`;
    const li = document.createElement('li');
    li.id = `stop-${stopKey}`;
    const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.direccion || '')}`;
    li.innerHTML = `
      <div class="stop-num">${idx + 1}</div>
      <div class="stop-info">
        ${p.horario ? `<div class="horario">🕐 ${p.horario}</div>` : ''}
        <div class="cliente">${p.cliente || 'Sin nombre'} ${p.pedidoId ? `· ${p.pedidoId}` : ''}</div>
        <div class="badges">
          ${p.tipo ? `<span class="badge ${p.tipo === 'Inicial' ? 'badge-inicial' : 'badge-incidencia'}">${p.tipo}</span>` : ''}
          ${(p.pallets !== undefined && p.pallets !== null) ? `<span class="badge badge-pallets">${p.pallets} pal.</span>` : ''}
          ${p.sinAscensor ? `<span class="badge badge-ascensor">🚫 Sin ascensor</span>` : ''}
        </div>
        <div class="direccion"><a class="maps" href="${mapsUrl}" target="_blank">${p.direccion || ''} ↗</a></div>
        <div class="meta">
          ${p.telefono ? `<a class="tel" href="tel:${p.telefono}">${p.telefono}</a> · ` : ''}
          ${p.notas ? p.notas : ''}
        </div>
        <div class="stop-actions">
          <button class="btn-entregado" onclick="toggleForm('${stopKey}','entregado')">✅ Entregado</button>
          <button class="btn-incidencia" onclick="toggleForm('${stopKey}','incidencia')">⚠️ Incidencia</button>
          ${p.decaUrl
            ? `<button class="btn-deca" onclick="window.open('${p.decaUrl}','_blank')">📄 DeCA</button>`
            : `<button class="btn-deca-off" disabled>📄 DeCA no disponible</button>`}
        </div>
        <div class="stop-form" id="form-${stopKey}">
          <textarea id="notas-${stopKey}" placeholder="Notas (obligatorio si es incidencia)"></textarea>
          <input type="file" id="foto-${stopKey}" accept="image/*" capture="environment">
          <img class="thumb-preview" id="thumb-${stopKey}" style="display:none;">
          <div class="form-actions">
            <button id="enviar-${stopKey}" onclick="enviarEstado('${stopKey}', ${idx})">Confirmar</button>
            <button class="secondary" onclick="toggleForm('${stopKey}')">Cancelar</button>
          </div>
          <div class="stop-sending" id="sending-${stopKey}"></div>
        </div>
      </div>
    `;
    ol.appendChild(li);

    li.querySelector(`#foto-${stopKey}`).addEventListener('change', (e) => {
      const file = e.target.files[0];
      const thumb = li.querySelector(`#thumb-${stopKey}`);
      if (file) { thumb.src = URL.createObjectURL(file); thumb.style.display = 'block'; }
      else { thumb.style.display = 'none'; }
    });
  });
  container.appendChild(ol);
}

let activeFormKey = null;
let pendingAction = null;

function toggleForm(stopKey, accion) {
  if (activeFormKey && activeFormKey !== stopKey) {
    document.getElementById(`form-${activeFormKey}`)?.classList.remove('open');
  }
  const form = document.getElementById(`form-${stopKey}`);
  if (!accion) { form.classList.remove('open'); activeFormKey = null; return; }
  pendingAction = accion;
  form.classList.add('open');
  activeFormKey = stopKey;
  const textarea = document.getElementById(`notas-${stopKey}`);
  textarea.placeholder = accion === 'incidencia' ? 'Describe la incidencia (obligatorio)' : 'Notas (opcional)';
  form.querySelector('.form-actions button:first-child').textContent =
    accion === 'incidencia' ? 'Confirmar incidencia' : 'Confirmar entrega';
}

// Comprime la imagen en el navegador antes de enviarla (máx 1280px, JPEG calidad 0.7)
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      const maxDim = 1280;
      let { width, height } = img;
      if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; }
      else if (height > maxDim) { width *= maxDim / height; height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function enviarEstado(stopKey, idx) {
  const webhookUrl = el('webhookUrl').value.trim();
  if (!webhookUrl) { alert('Falta configurar la URL del webhook de Power Automate.'); return; }

  const p = paradasRaw[idx];
  const notas = document.getElementById(`notas-${stopKey}`).value.trim();
  const fotoInput = document.getElementById(`foto-${stopKey}`);
  const sendingEl = document.getElementById(`sending-${stopKey}`);
  const accion = pendingAction;

  if (accion === 'incidencia' && !notas) { alert('Describe la incidencia antes de confirmar.'); return; }

  sendingEl.textContent = 'Enviando...';
  try {
    let fotoBase64 = null;
    if (fotoInput.files[0]) fotoBase64 = await compressImage(fotoInput.files[0]);

    let geo = null;
    if (navigator.geolocation) {
      try {
        geo = await new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
            () => resolve(null),
            { timeout: 4000 }
          );
        });
      } catch (e) { geo = null; }
    }

    const payload = {
      pedidoId: p.pedidoId || null,
      cliente: p.cliente || null,
      direccion: p.direccion || null,
      estado: accion === 'incidencia' ? 'incidencia' : 'entregado',
      notas: notas || null,
      foto: fotoBase64,
      ubicacion: geo,
      fecha: new Date().toISOString()
    };

    const res = await fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    sendingEl.textContent = '';
    const li = document.getElementById(`stop-${stopKey}`);
    li.classList.remove('done', 'incident');
    li.classList.add(accion === 'incidencia' ? 'incident' : 'done');
    toggleForm(stopKey);
  } catch (err) {
    sendingEl.textContent = 'Error al enviar: ' + err.message + ' (reintenta)';
  }
}

el('cargarBtn').addEventListener('click', cargarParadas);

loadConfig();
</script>

</body>
</html>
